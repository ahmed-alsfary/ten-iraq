<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}منصة ذكية للبحث ومراقبة وتحليل المناقصات الحكومية العراقية{% endblock %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css?v=6" />
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header {% block header_class %}{% endblock %}">
    <a href="/" class="brand">TenderIQ <span>Iraq</span></a>
    <nav class="nav-links" aria-label="القائمة الرئيسية">
      <a href="/search">البحث</a>
      <a href="/api/docs">API</a>
      <a class="btn btn-small {% block nav_cta_class %}btn-primary{% endblock %}" href="/search">استكشف المناقصات</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>TenderIQ Iraq — مراقبة المناقصات الحكومية العراقية</p>
      <p>مصدر البيانات: itp.iq</p>
    </div>
  </footer>
</body>
</html>
